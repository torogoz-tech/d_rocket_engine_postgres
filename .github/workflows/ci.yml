name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: d_rocket_ci
          POSTGRES_PASSWORD: d_rocket_ci
          POSTGRES_DB: d_rocket_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_PG_URL: postgres://d_rocket_ci:d_rocket_ci@localhost:5432/d_rocket_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket
          ref: main
          path: .ci/deps/d_rocket
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure local package overrides
        run: |
          printf '%s\n' \
            'dependency_overrides:' \
            '  d_rocket:' \
            '    path: .ci/deps/d_rocket' > pubspec_overrides.yaml
      - run: flutter pub get
      - run: dart analyze
      - run: dart test --reporter=expanded

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket
          ref: main
          path: .ci/deps/d_rocket
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify tag and package version
        run: |
          test "$(sed -n 's/^version: *//p' pubspec.yaml | head -1)" = "${GITHUB_REF#refs/tags/v}"
      - name: Configure local package overrides
        run: |
          printf '%s\n' \
            'dependency_overrides:' \
            '  d_rocket:' \
            '    path: .ci/deps/d_rocket' > pubspec_overrides.yaml
      - run: flutter pub get
      - run: dart pub publish --dry-run
